services:
  # Base image with all dependencies (build once, use many times)
  base:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: cam_lidar_calibration:base-${ROS_DISTRO:-jazzy}
    container_name: cam_lidar_base_${ROS_DISTRO:-jazzy}
    profiles:
      - base  # Only built when explicitly requested

  # Development image (extends base, mounts source code)
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        BASE_IMAGE: cam_lidar_calibration:base-${ROS_DISTRO:-jazzy}
    image: cam_lidar_calibration:dev-${ROS_DISTRO:-jazzy}
    container_name: cam_lidar_dev_${ROS_DISTRO:-jazzy}
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    ipc: host
    pid: host
    
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    
    volumes:
      # X11 for GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:rw
      
      # Mount ONLY the cam_lidar_calibration package (not entire workspace)
      - ../:/ros2_ws/src/cam_lidar_calibration:rw
      
      # Mount data directories
      - /home/jjustin/Desktop/SSD Data/ITS Cam Calibration:/root/rosbags:rw
      
      # Optional: Mount additional data directories
      # - ${HOME}/datasets:/datasets:rw
      # - ${HOME}/bags:/bags:rw
      
      # Persist build artifacts for faster rebuilds
      - cam_lidar_build:/ros2_ws/build
      - cam_lidar_install:/ros2_ws/install
      - cam_lidar_log:/ros2_ws/log
    
    devices:
      - /dev/dri:/dev/dri  # GPU access for visualization
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    command: bash

volumes:
  cam_lidar_build:
  cam_lidar_install:
  cam_lidar_log:
